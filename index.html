<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inlägg - morgondimma</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://morgondimma.se"><!-- Open Graph --><meta property="og:title" content="Inlägg"><meta property="og:type" content="website"><meta property="og:site_name" content="morgondimma"><!-- Twitter Card --><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Inlägg"><script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script><link rel="stylesheet" href="/static/style.css?v=1781539733"></head><body><header class="site-header"><a href="/" class="site-logo">morgondimma</a> <button class="hamburger" id="menu-toggle" aria-label="Menu"><span></span> <span></span> <span></span></button><nav class="site-nav" id="site-nav"><div class="nav-links" id="nav-links"></div></nav></header><main><h1>Inlägg</h1><div class="post-grid"><a href="/posts/example-page" class="post-card"><img class="post-grid-img" src="/uploads/originals/6bbf38c2448f42f2dce19d6545421b9b.jpeg" alt="Example page"><div class="post-card-body"><h2>Example page</h2><time>15 juni 2026</time> <p>This is just an example page</p></div></a></div></main><footer><div class="footer-inner"><div class="newsletter"><h3>Prenumerera</h3><p>Få nya inlägg direkt i din inkorg.</p><form hx-post="/api/subscribe" hx-target="find button" hx-swap="outerHTML"><input type="email" name="email" placeholder="din@epost.se" required> <button type="submit">Prenumerera</button></form></div><p class="footer-copy">&copy; 2026 morgondimma</p></div></footer><script>
				(function() {
					var toggle = document.getElementById('menu-toggle');
					var nav = document.getElementById('site-nav');
					function closeNav() {
						nav.classList.remove('open');
						toggle.classList.remove('open');
						document.body.classList.remove('nav-open');
					}
					toggle.addEventListener('click', function() {
						if (nav.classList.contains('open')) {
							closeNav();
						} else {
							nav.classList.add('open');
							toggle.classList.add('open');
							document.body.classList.add('nav-open');
						}
					});
					function renderNav(items) {
						var container = document.getElementById('nav-links');
						items.forEach(function(item) {
							var a = document.createElement('a');
							a.href = item.url;
							a.textContent = item.label;
							container.appendChild(a);
						});
					}
					if (window.__NAV_ITEMS__) {
						renderNav(window.__NAV_ITEMS__);
					} else {
						fetch('/api/nav').then(function(r) { return r.json(); }).then(renderNav);
					}
				})();
			</script></body></html>
